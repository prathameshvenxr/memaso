[project]
name = "memaso"
version = "0.1.0"
description = "Modular, model-agnostic memory engine"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "jsonschema>=4",
]

[project.optional-dependencies]
redis = ["redis>=5"]
fastembed = ["fastembed>=0.3"]   # local ONNX embeddings: free, no torch
mcp = ["mcp>=2"]
langgraph = ["langgraph>=0.2"]
local-embed = ["sentence-transformers>=3"]   # heavy (torch); Ollama embeddings are the light default
dev = ["pytest>=8", "pytest-asyncio>=0.24", "redis>=5", "mcp>=2", "langgraph>=0.2", "fastembed>=0.3"]

[tool.setuptools.packages.find]
include = ["memory_core*"]

[tool.setuptools.package-data]
memory_core = ["prompts/**/*", "migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: needs real API keys or services (deselected by default)"]
addopts = "-m 'not live'"
